server {
    listen 80;

    location /static/ {
        alias /home/app/billing/static/;
    }

    location / {
        proxy_pass http://billingsite:8000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}
